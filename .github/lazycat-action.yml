version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: pdfmathtranslate-next

build:
  run_buildscript: false

images:
  - id: pdfmathtranslate-next
    target: service
    service: pdfmtn
    source: docker.1ms.run/awwaawwa/pdfmathtranslate-next
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+-babeldoc-v\d+\.\d+\.\d+$'
    version_regex: '^v?(?P<version>\d+\.\d+\.\d+)-babeldoc-v\d+\.\d+\.\d+$'
    version_template: '{version}'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: PDFMathTranslate Next
    summary: 由 GitHub Actions 自动发布
